[package]
name = "mod-voicechat"
version = "0.1.0"
edition = "2024"

[dependencies]
# The launcher points this at the Horizon source it builds the game from. Any other
# dependency must be a crate and version in Horizon's Cargo.lock.
horizon-client = { git = "https://github.com/horizon-rust/horizon" }
# AES-128-GCM for the voice datagrams (in the lock through rustls).
ring = "0.17"
# Opus in pure Rust: one of the crates Horizon lists for mods (crates/horizon-mod-deps, issue #7759).
rusty-opus = "1"
# Microphone and speakers (in the lock through the game's own audio).
cpal = "0.16"
